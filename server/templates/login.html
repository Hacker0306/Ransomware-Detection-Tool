<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+8fhAXLRk2vvoC2f3B09zVXn8CA5QIVfZOJ3BCsw2P0p/We" crossorigin="anonymous">

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <title>CyberClaw | AI-Powered Ransomware Detection</title>

    <style>
      body {
        background-image: url('{{ url_for('static', filename='back.jpg') }}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }
    </style>

  </head>

  <nav class="navbar navbar-dark bg-dark justify-content-center">
    <div class="container">
      <a class="navbar-brand" href="/">
        🛡️ CyberClaw | AI-Powered Ransomware Detection
      </a>
    </div>
      </nav>

  <body>
    <br><br>
    <section class="vh-100 gradient-custom">
      <div class="container py-4 h-90">
        <div class="row d-flex justify-content-center align-items-center h-100">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card bg-dark text-white" style="border-radius: 1rem;">
              <div class="card-body p-3 text-center">

                <div class="mb-md-5 mt-md-4 pb-5">

                  <h2 class="fw-bold mb-1 text-uppercase">Login</h2>
                  <p class="text-white-50 mb-5">Please enter your username and password!</p>

                  <form name="loginform" method="POST">
                    <div class="form-outline form-white mb-4">
                    <input type="text" name="username" class="form-control form-control-lg" placeholder="username" required/>
                  </div>

                  <div class="form-outline form-white mb-4">
                    <input type="password" name="password" class="form-control form-control-lg" placeholder="Password" required/>
                  </div>
                  <!-- Recruiter Demo Credentials -->
                    <div class="alert alert-info py-0 px-1 mb-1 text-start">
                    
                       <small>
                       <strong>Demo Login:</strong><br>
                          Username: <code>admin</code><br>
                          Password: <code>password</code>
                       </small>
                    
                    </div>

                  <button class="btn btn-outline-light btn-lg px-5" name="login" type="submit">Login</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

  </body>

<script type="text/javascript">

  {% if Flag %}
      swal({
        text: "{{ mymessage }}",
      })
      .then((homemessage) => {
        if(homemessage)
        {
          {% if Navigate %}
            window.location.href = "/";
        {% endif %}
        }
      });
  {% else %}
      None
  {% endif %}


</script>

</html>
